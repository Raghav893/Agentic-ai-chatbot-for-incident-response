spring:
  application:
    name: threatguard-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/threatguard}
    username: ${SPRING_DATASOURCE_USERNAME:threatguard}
    password: ${SPRING_DATASOURCE_PASSWORD:threatguard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-message: never
  servlet:
    encoding:
      charset: UTF-8
      force: true

ai:
  service-url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
  timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:75}
